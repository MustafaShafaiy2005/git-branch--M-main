
{% extends "base.html" %}

{% block title %}Create Mock Test{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="mb-2">Create SAT Mock Test</h2>
                    <p class="text-muted mb-4">
                        Create a separate test, then assign its questions.
                    </p>

                    <form method="POST">

                        <div class="mb-3">
                            <label for="title" class="form-label">
                                Mock Test Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                name="title"
                                placeholder="e.g. SAT Full-Length Mock Test 1"
                                maxlength="150"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">
                                Description
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="4"
                                placeholder="Describe this mock test (optional)"
                            ></textarea>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Create Mock Test
                            </button>

                            <a
                                href="{{ url_for('views.mock_tests') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
